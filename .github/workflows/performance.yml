name: Performance & Load Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  # ============================================================================
  # Lighthouse Performance Audit
  # ============================================================================
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Start backend server
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        DATABASE_URL: sqlite:///./test.db
        SECRET_KEY: test_secret_key

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v12
      with:
        urls: |
          http://localhost:8000
        uploadArtifacts: true
        temporaryPublicStorage: true

  # ============================================================================
  # Load Testing with k6
  # ============================================================================
  load-test:
    name: Load Testing (k6)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Start backend server
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        DATABASE_URL: sqlite:///./test.db
        SECRET_KEY: test_secret_key
        DEBUG: "false"

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run load tests
      run: k6 run tests/load/api-load-test.js
      env:
        BASE_URL: http://localhost:8000

    - name: Upload k6 results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: k6-load-test-results
        path: load-test-results.json

  # ============================================================================
  # Backend Performance Tests
  # ============================================================================
  backend-performance:
    name: Backend Performance Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agtrmerkezi
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agtrmerkezi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run performance benchmarks
      env:
        DATABASE_URL: postgresql://agtrmerkezi:test_password@localhost:5432/agtrmerkezi_test
        SECRET_KEY: test_secret_key
      run: |
        pytest tests/ -v -m "benchmark" --benchmark-only --benchmark-json=benchmark-results.json
      continue-on-error: true

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-benchmark-results
        path: benchmark-results.json

  # ============================================================================
  # Frontend Bundle Size Check
  # ============================================================================
  bundle-size:
    name: Frontend Bundle Size Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Analyze bundle size
      working-directory: ./frontend
      run: |
        echo "Bundle size analysis:"
        find ../static/dist -type f -name "*.js" -exec ls -lh {} \; | awk '{print $9, $5}'
        echo ""
        echo "Total bundle size:"
        du -sh ../static/dist

    - name: Check bundle size limit
      run: |
        TOTAL_SIZE=$(du -s static/dist | awk '{print $1}')
        MAX_SIZE=10240  # 10MB in KB
        if [ $TOTAL_SIZE -gt $MAX_SIZE ]; then
          echo "❌ Bundle size ($TOTAL_SIZE KB) exceeds limit ($MAX_SIZE KB)"
          exit 1
        else
          echo "✅ Bundle size ($TOTAL_SIZE KB) is within limit"
        fi

  # ============================================================================
  # Performance Summary
  # ============================================================================
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [lighthouse, load-test, backend-performance, bundle-size]
    if: always()

    steps:
    - name: Check results
      run: |
        echo "Lighthouse: ${{ needs.lighthouse.result }}"
        echo "Load Test: ${{ needs.load-test.result }}"
        echo "Backend Performance: ${{ needs.backend-performance.result }}"
        echo "Bundle Size: ${{ needs.bundle-size.result }}"

        if [ "${{ needs.lighthouse.result }}" = "failure" ] || \
           [ "${{ needs.load-test.result }}" = "failure" ] || \
           [ "${{ needs.backend-performance.result }}" = "failure" ] || \
           [ "${{ needs.bundle-size.result }}" = "failure" ]; then
          echo "⚠️ Some performance checks failed!"
          exit 1
        else
          echo "✅ All performance checks passed!"
        fi
