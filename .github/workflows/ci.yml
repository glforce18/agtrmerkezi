name: CI - Backend Tests & Linting

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  backend-tests:
    name: Backend Tests & Quality Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agtrmerkezi
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agtrmerkezi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio black isort flake8 bandit

    - name: Check code formatting with Black
      run: |
        black --check app/ tests/ || echo "Black formatting issues found"
      continue-on-error: true

    - name: Check imports with isort
      run: |
        isort --check-only app/ tests/ || echo "Import sorting issues found"
      continue-on-error: true

    - name: Lint with flake8
      run: |
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Security check with Bandit
      run: |
        bandit -r app/ -f json -o bandit-report.json || echo "Security issues found"
      continue-on-error: true

    - name: Run tests with pytest
      env:
        DATABASE_URL: postgresql://agtrmerkezi:test_password@localhost:5432/agtrmerkezi_test
        SECRET_KEY: test_secret_key_for_ci
        DEBUG: "true"
      run: |
        pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend
        name: codecov-umbrella
      continue-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          pytest-report.xml
          coverage.xml
          bandit-report.json

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Check for ESLint errors (if configured)
      working-directory: ./frontend
      run: |
        if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
          npm run lint || echo "ESLint issues found"
        else
          echo "ESLint not configured, skipping"
        fi
      continue-on-error: true

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      env:
        NODE_ENV: production

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-check]
    if: always()

    steps:
    - name: Check results
      run: |
        echo "Backend Tests: ${{ needs.backend-tests.result }}"
        echo "Frontend Check: ${{ needs.frontend-check.result }}"

        if [ "${{ needs.backend-tests.result }}" = "failure" ] || [ "${{ needs.frontend-check.result }}" = "failure" ]; then
          echo "⚠️ Some checks failed. Please review the logs above."
          exit 1
        else
          echo "✅ All checks passed!"
        fi
