name: Quick Check

on:
  push:
    branches: [ master, main ]

jobs:
  quick-check:
    name: Quick Syntax & Import Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install basic dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Python Syntax Check
      run: |
        python -m py_compile app/**/*.py || echo "Syntax errors found"
      continue-on-error: true

    - name: Check Python formatting
      run: |
        black --check app/ || echo "⚠️ Code formatting issues found - run 'black app/' locally"
      continue-on-error: true

    - name: Check imports
      run: |
        isort --check-only app/ || echo "⚠️ Import sorting issues - run 'isort app/' locally"
      continue-on-error: true

    - name: Basic linting
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Critical linting errors found"
      continue-on-error: true

    - name: Summary
      run: |
        echo "✅ Quick check completed!"
        echo "Note: Some checks may have warnings. Review logs above."
