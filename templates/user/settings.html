{% extends "base.html" %}

{% block title %}Hesap Ayarları - AGTR Merkezi{% endblock %}

{% block content %}
<section class="settings-section">
    <div class="container">
        <div class="settings-header reveal">
            <h1>Hesap Ayarları</h1>
            <p class="text-secondary">Profil bilgilerini ve güvenlik ayarlarını yönet.</p>
        </div>
        
        <div class="settings-grid">
            <!-- Profile Settings -->
            <div class="settings-card glass-card reveal">
                <div class="settings-card-header">
                    <h2>Profil Bilgileri</h2>
                </div>
                <form id="profileForm" class="settings-form">
                    <div class="form-group">
                        <label for="display_name">Görünen Ad</label>
                        <input type="text" id="display_name" name="display_name" value="{{ current_user.display_name or '' }}" placeholder="Görünen adınız">
                    </div>
                    <div class="form-group">
                        <label for="email">E-posta</label>
                        <input type="email" id="email" name="email" value="{{ current_user.email or '' }}" placeholder="E-posta adresiniz">
                    </div>
                    <div class="form-group">
                        <label for="steam_id">Steam ID</label>
                        <input type="text" id="steam_id" name="steam_id" value="{{ current_user.steam_id or '' }}" placeholder="STEAM_0:0:123456">
                    </div>
                    <div class="form-group">
                        <label for="bio">Hakkında</label>
                        <textarea id="bio" name="bio" rows="3" placeholder="Kendiniz hakkında birkaç şey yazın...">{{ current_user.bio or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Kaydet</button>
                </form>
            </div>
            
            <!-- Avatar Settings -->
            <div class="settings-card glass-card reveal">
                <div class="settings-card-header">
                    <h2>Profil Fotoğrafı</h2>
                </div>
                <div class="avatar-settings">
                    <div class="current-avatar">
                        <img src="{{ get_user_avatar(avatar_path=current_user.avatar, user_id=current_user.id) }}" alt="Avatar" id="avatarPreview">
                    </div>
                    <div class="avatar-actions">
                        <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="previewAvatar(this)">
                        <button type="button" class="btn btn-primary" onclick="document.getElementById('avatarInput').click()">
                            <i class="fas fa-image me-2"></i>Fotoğraf Seç
                        </button>
                        <button type="button" class="btn btn-success" onclick="uploadAvatar()" id="uploadBtn">
                            <i class="fas fa-upload me-2"></i>Yükle
                        </button>
                        <button type="button" class="btn btn-danger" onclick="deleteAvatar()" id="deleteBtn" {% if not current_user.avatar %}style="display:none;"{% endif %}>
                            <i class="fas fa-trash me-2"></i>Sil
                        </button>
                    </div>
                    <small class="text-secondary">PNG, JPG veya WebP - Max 5MB</small>
                </div>
            </div>
            
            <!-- Security Settings -->
            <div class="settings-card glass-card reveal">
                <div class="settings-card-header">
                    <h2>Güvenlik</h2>
                </div>
                <form id="passwordForm" class="settings-form">
                    <div class="form-group">
                        <label for="current_password">Mevcut Şifre</label>
                        <input type="password" id="current_password" name="current_password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="new_password">Yeni Şifre</label>
                        <input type="password" id="new_password" name="new_password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Yeni Şifre (Tekrar)</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary">Şifreyi Değiştir</button>
                </form>
            </div>
            
            <!-- Notification Settings -->
            <div class="settings-card glass-card reveal">
                <div class="settings-card-header">
                    <h2>Bildirimler</h2>
                </div>
                <div class="settings-form">
                    <div class="toggle-group">
                        <label class="toggle-label">
                            <span>E-posta bildirimleri</span>
                            <input type="checkbox" id="email_notifications" checked>
                            <span class="toggle-switch"></span>
                        </label>
                    </div>
                    <div class="toggle-group">
                        <label class="toggle-label">
                            <span>Forum yanıt bildirimleri</span>
                            <input type="checkbox" id="forum_notifications" checked>
                            <span class="toggle-switch"></span>
                        </label>
                    </div>
                    <div class="toggle-group">
                        <label class="toggle-label">
                            <span>Sunucu durum bildirimleri</span>
                            <input type="checkbox" id="server_notifications" checked>
                            <span class="toggle-switch"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
.settings-section { padding: 40px 20px; min-height: calc(100vh - 70px); }
.container { max-width: 1000px; margin: 0 auto; }
.settings-header { margin-bottom: 40px; }
.settings-header h1 { font-size: 28px; margin-bottom: 8px; }
.text-secondary { color: var(--text-secondary); }

.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 24px;
}

.settings-card { padding: 0; }
.settings-card-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-color);
}
.settings-card-header h2 { font-size: 18px; font-weight: 600; }

.settings-form { padding: 24px; }
.form-group { margin-bottom: 20px; }
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-secondary);
}
.form-group input, .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    background: var(--glass-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
}
.form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--primary-color);
}

.avatar-settings {
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}
.current-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--primary-color);
}
.current-avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-actions { display: flex; gap: 12px; }

.toggle-group { padding: 16px 24px; border-bottom: 1px solid var(--border-color); }
.toggle-group:last-child { border-bottom: none; }
.toggle-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}
.toggle-label input { display: none; }
.toggle-switch {
    width: 48px;
    height: 26px;
    background: var(--glass-bg);
    border-radius: 13px;
    position: relative;
    transition: all 0.3s;
}
.toggle-switch::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: all 0.3s;
}
.toggle-label input:checked + .toggle-switch {
    background: var(--primary-color);
}
.toggle-label input:checked + .toggle-switch::after {
    left: 25px;
}

@media (max-width: 768px) {
    .settings-grid { grid-template-columns: 1fr; }
}
</style>

<script>
// Helper function for toast messages
function showToast(type, message) {
    if (typeof AGTR !== 'undefined' && AGTR.Toast && AGTR.Toast[type]) {
        AGTR.Toast[type](message);
    } else {
        alert(message);
    }
}

// Profile form
document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = 'Kaydediliyor...';

    try {
        const response = await fetch('/api/user/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(formData))
        });
        if (response.ok) {
            showToast('success', 'Profil güncellendi!');
        } else {
            const data = await response.json();
            showToast('error', data.detail || 'Bir hata oluştu');
        }
    } catch (error) {
        showToast('error', 'Bağlantı hatası');
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Kaydet';
    }
});

// Password form
document.getElementById('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    if (formData.get('new_password') !== formData.get('confirm_password')) {
        showToast('error', 'Şifreler eşleşmiyor!');
        return;
    }
    if (formData.get('new_password').length < 6) {
        showToast('error', 'Şifre en az 6 karakter olmalı!');
        return;
    }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = 'Değiştiriliyor...';

    try {
        const response = await fetch('/api/user/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                current_password: formData.get('current_password'),
                new_password: formData.get('new_password'),
                confirm_password: formData.get('new_password')
            })
        });
        if (response.ok) {
            showToast('success', 'Şifre değiştirildi!');
            e.target.reset();
        } else {
            const data = await response.json();
            showToast('error', data.detail || 'Bir hata oluştu');
        }
    } catch (error) {
        showToast('error', 'Bağlantı hatası');
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Şifreyi Değiştir';
    }
});

function previewAvatar(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('avatarPreview').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function uploadAvatar() {
    const input = document.getElementById('avatarInput');
    const uploadBtn = document.getElementById('uploadBtn');

    if (!input.files || !input.files[0]) {
        AGTR.Toast.error('Lütfen bir fotoğraf seçin');
        return;
    }

    // Button state
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Yükleniyor...';

    const formData = new FormData();
    formData.append('file', input.files[0]); // API 'file' bekliyor

    try {
        const response = await fetch('/api/user/avatar', {
            method: 'POST',
            body: formData,
            credentials: 'include'
        });

        const data = await response.json();

        if (response.ok) {
            AGTR.Toast.success('Profil fotoğrafı güncellendi!');
            // Yeni avatarı göster
            if (data.avatar) {
                document.getElementById('avatarPreview').src = data.avatar;
            }
            // Delete butonunu göster
            document.getElementById('deleteBtn').style.display = 'inline-flex';
            // 1 saniye sonra sayfayı yenile
            setTimeout(() => location.reload(), 1000);
        } else {
            AGTR.Toast.error(data.detail || 'Yükleme başarısız');
        }
    } catch (error) {
        console.error('Upload error:', error);
        AGTR.Toast.error('Bir hata oluştu: ' + error.message);
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<i class="fas fa-upload me-2"></i>Yükle';
    }
}

async function deleteAvatar() {
    if (!confirm('Profil fotoğrafınızı silmek istediğinizden emin misiniz?')) {
        return;
    }

    try {
        const response = await fetch('/api/user/avatar', {
            method: 'DELETE',
            credentials: 'include'
        });

        if (response.ok) {
            AGTR.Toast.success('Profil fotoğrafı silindi');
            // Varsayılan avatara dön
            document.getElementById('avatarPreview').src = '/static/images/default-avatar.svg';
            // Delete butonunu gizle
            document.getElementById('deleteBtn').style.display = 'none';
            // Input'u temizle
            document.getElementById('avatarInput').value = '';
        } else {
            AGTR.Toast.error('Silme başarısız');
        }
    } catch (error) {
        AGTR.Toast.error('Bir hata oluştu');
    }
}
</script>
{% endblock %}
