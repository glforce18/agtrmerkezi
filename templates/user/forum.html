{% extends "user/base.html" %}

{% block title %}Forum - AGTR{% endblock %}

{% block content %}
<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">
                <i class="fas fa-comments me-2 text-primary"></i>Forum
            </h1>
            <p class="text-muted mb-0">Topluluk tartışmaları ve yardım</p>
        </div>
        <a href="/forum/new" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Yeni Konu Aç
        </a>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 rounded-3 p-3 me-3">
                        <i class="fas fa-folder text-primary fa-lg"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-0">Kategoriler</h6>
                        <h4 class="mb-0" id="statCategories">-</h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-success bg-opacity-10 rounded-3 p-3 me-3">
                        <i class="fas fa-comments text-success fa-lg"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-0">Konular</h6>
                        <h4 class="mb-0" id="statTopics">-</h4>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-info bg-opacity-10 rounded-3 p-3 me-3">
                        <i class="fas fa-reply text-info fa-lg"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-0">Yanıtlar</h6>
                        <h4 class="mb-0" id="statReplies">-</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Categories List -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent border-0 py-3">
            <h5 class="mb-0"><i class="fas fa-folder-tree me-2"></i>Kategoriler</h5>
        </div>
        <div class="card-body p-0">
            <div id="categoriesContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Topics -->
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-header bg-transparent border-0 py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fas fa-clock me-2"></i>Son Konular</h5>
            <a href="/forum/all" class="btn btn-sm btn-outline-primary">Tümünü Gör</a>
        </div>
        <div class="card-body p-0">
            <div id="recentTopicsContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadForumData();
});

async function loadForumData() {
    try {
        // Kategorileri yükle
        const catResponse = await fetch('/api/forum/categories');
        const catData = await catResponse.json();
        renderCategories(catData.categories || []);
        document.getElementById('statCategories').textContent = catData.categories?.length || 0;
        
        // Son konuları yükle
        const topicsResponse = await fetch('/api/forum/topics?limit=5');
        const topicsData = await topicsResponse.json();
        renderRecentTopics(topicsData.topics || []);
        document.getElementById('statTopics').textContent = topicsData.total || 0;
        
        // İstatistikleri yükle
        const statsResponse = await fetch('/api/forum/stats');
        const stats = await statsResponse.json();
        document.getElementById('statReplies').textContent = stats.replies || 0;
        
    } catch (error) {
        console.error('Forum yüklenemedi:', error);
        showToast('Forum yüklenirken hata oluştu', 'error');
    }
}

function renderCategories(categories) {
    const container = document.getElementById('categoriesContainer');
    
    if (categories.length === 0) {
        container.innerHTML = '<div class="text-center py-5 text-muted">Henüz kategori bulunmuyor</div>';
        return;
    }
    
    container.innerHTML = '<div class="list-group list-group-flush">' +
        categories.map(cat => 
            '<a href="/forum/category/' + cat.slug + '" class="list-group-item list-group-item-action py-3">' +
                '<div class="d-flex align-items-center">' +
                    '<div class="bg-primary bg-opacity-10 rounded-3 p-3 me-3">' +
                        '<i class="' + (cat.icon || 'fas fa-folder') + ' text-primary fa-lg"></i>' +
                    '</div>' +
                    '<div class="flex-grow-1">' +
                        '<h6 class="mb-1">' + escapeHtml(cat.name) + '</h6>' +
                        '<small class="text-muted">' + escapeHtml(cat.description || '') + '</small>' +
                    '</div>' +
                    '<div class="text-end">' +
                        '<span class="badge bg-primary rounded-pill">' + (cat.topic_count || 0) + ' konu</span>' +
                    '</div>' +
                '</div>' +
            '</a>'
        ).join('') +
    '</div>';
}

function renderRecentTopics(topics) {
    const container = document.getElementById('recentTopicsContainer');
    
    if (topics.length === 0) {
        container.innerHTML = '<div class="text-center py-5 text-muted">Henüz konu bulunmuyor</div>';
        return;
    }
    
    container.innerHTML = '<div class="list-group list-group-flush">' +
        topics.map(topic => {
            const badges = [];
            if (topic.is_pinned) badges.push('<span class="badge bg-info-subtle text-info me-1"><i class="fas fa-thumbtack"></i></span>');
            if (topic.is_locked) badges.push('<span class="badge bg-warning-subtle text-warning me-1"><i class="fas fa-lock"></i></span>');
            
            return '<a href="/forum/topic/' + topic.slug + '" class="list-group-item list-group-item-action py-3">' +
                '<div class="d-flex justify-content-between align-items-start">' +
                    '<div>' +
                        '<h6 class="mb-1">' + badges.join('') + escapeHtml(topic.title) + '</h6>' +
                        '<small class="text-muted">' +
                            '<i class="fas fa-user me-1"></i>' + escapeHtml(topic.author_name || 'Anonim') +
                            ' <i class="fas fa-clock ms-2 me-1"></i>' + formatDate(topic.created_at) +
                        '</small>' +
                    '</div>' +
                    '<div class="text-end">' +
                        '<span class="badge bg-light text-dark">' +
                            '<i class="fas fa-reply me-1"></i>' + (topic.reply_count || 0) +
                        '</span>' +
                    '</div>' +
                '</div>' +
            '</a>';
        }).join('') +
    '</div>';
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    const now = new Date();
    const diff = now - date;
    
    if (diff < 60000) return 'Az önce';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' dk önce';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' saat önce';
    if (diff < 604800000) return Math.floor(diff / 86400000) + ' gün önce';
    
    return date.toLocaleDateString('tr-TR');
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
