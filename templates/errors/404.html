<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - AGTR Merkezi</title>
    <script>
        (function() {
            var theme = localStorage.getItem('agtr-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-family: var(--font-display);
            font-size: 120px;
            font-weight: 700;
            background: var(--gradient-primary, linear-gradient(135deg, #ff6b00, #ff8c00));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .error-message {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Sayfa Bulunamadı</h1>
            <p class="error-message">Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
            <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
        </div>
    </div>
</body>
</html>
