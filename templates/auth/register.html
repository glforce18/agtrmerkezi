{% extends "base.html" %}

{% block title %}Kayıt Ol - AGTR Merkezi{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <h1 class="auth-title">Kayıt Ol</h1>
                <p class="auth-subtitle">Yeni hesap oluşturun</p>
            </div>
            
            {% if error %}
            <div class="alert alert-error">
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <form class="auth-form" id="registerForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="reg-username">Kullanıcı Adı</label>
                    <input type="text" name="username" id="reg-username" class="form-control" placeholder="Kullanıcı adınız" required minlength="3" maxlength="32" autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">E-posta</label>
                    <input type="email" name="email" id="reg-email" class="form-control" placeholder="ornek@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Şifre</label>
                    <input type="password" name="password" id="reg-password" class="form-control" placeholder="En az 6 karakter" required minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password-confirm">Şifre Tekrar</label>
                    <input type="password" name="password_confirm" id="reg-password-confirm" class="form-control" placeholder="Şifrenizi tekrar girin" required autocomplete="new-password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" id="reg-terms" required aria-describedby="terms-desc">
                        <span class="checkbox-custom"></span>
                        <span id="terms-desc"><a href="/terms" target="_blank" class="terms-link">Kullanım şartlarını</a> kabul ediyorum</span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-full">
                    Kayıt Ol
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Zaten hesabınız var mı? <a href="/login">Giriş Yap</a></p>
            </div>
        </div>
    </div>
</section>

<style>
.auth-section {
    min-height: calc(100vh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.auth-container {
    width: 100%;
    max-width: 420px;
}

.auth-card {
    padding: 40px;
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
}

.auth-subtitle {
    color: var(--text-secondary);
}

.auth-form .form-group {
    margin-bottom: 20px;
}

.form-options {
    margin-bottom: 24px;
}

.checkbox-label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
}

.checkbox-label input {
    display: none;
}

.checkbox-custom {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
}

.checkbox-label input:checked + .checkbox-custom {
    background: var(--primary-color);
    border-color: var(--primary-color);
}

.checkbox-label input:checked + .checkbox-custom::after {
    content: '✓';
    color: white;
    font-size: 12px;
}

.checkbox-label a,
.checkbox-label .terms-link {
    color: var(--primary-color);
    text-decoration: none;
}

.checkbox-label a:hover,
.checkbox-label .terms-link:hover {
    text-decoration: underline;
}

.auth-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary);
}

.auth-footer a {
    color: var(--neon-green);
    text-decoration: none;
    font-weight: 600;
}

.alert {
    padding: 12px 16px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
}

.alert-error {
    background: rgba(255, 51, 102, 0.1);
    border: 1px solid rgba(255, 51, 102, 0.3);
    color: var(--neon-red);
}

.w-full {
    width: 100%;
}
</style>

<script>
// Helper function for showing toast messages
function showToast(type, message) {
    if (typeof AGTR !== 'undefined' && AGTR.Toast && AGTR.Toast[type]) {
        AGTR.Toast[type](message);
    } else {
        alert(message);
    }
}

document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    if (formData.get('password') !== formData.get('password_confirm')) {
        showToast('error', 'Şifreler eşleşmiyor');
        return;
    }

    // Disable button and show loading
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Kayıt yapılıyor...';

    const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password')
    };

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            showToast('success', 'Kayıt başarılı! Yönlendiriliyorsunuz...');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } else {
            showToast('error', result.detail || 'Kayıt başarısız');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    } catch (error) {
        showToast('error', 'Bir hata oluştu. Lütfen tekrar deneyin.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    }
});
</script>
{% endblock %}
