{% extends "base.html" %}

{% block title %}Kayıt Ol - AGTR Merkezi{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <h1 class="auth-title">Kayıt Ol</h1>
                <p class="auth-subtitle">Yeni hesap oluşturun</p>
            </div>
            
            {% if error %}
            <div class="alert alert-error">
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <form class="auth-form" method="post" action="/api/auth/register" id="registerForm">
                <div class="form-group">
                    <label class="form-label">Kullanıcı Adı</label>
                    <input type="text" name="username" class="form-control" placeholder="Kullanıcı adınız" required minlength="3" maxlength="32">
                </div>
                
                <div class="form-group">
                    <label class="form-label">E-posta</label>
                    <input type="email" name="email" class="form-control" placeholder="ornek@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" placeholder="En az 6 karakter" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Şifre Tekrar</label>
                    <input type="password" name="password_confirm" class="form-control" placeholder="Şifrenizi tekrar girin" required>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="terms" required>
                        <span><a href="/terms" target="_blank">Kullanım şartlarını</a> kabul ediyorum</span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-full">
                    Kayıt Ol
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Zaten hesabınız var mı? <a href="/login">Giriş Yap</a></p>
            </div>
        </div>
    </div>
</section>

<style>
.auth-section {
    min-height: calc(100vh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.auth-container {
    width: 100%;
    max-width: 420px;
}

.auth-card {
    padding: 40px;
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
}

.auth-subtitle {
    color: var(--text-secondary);
}

.auth-form .form-group {
    margin-bottom: 20px;
}

.form-options {
    margin-bottom: 24px;
}

.checkbox-label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
}

.checkbox-label input {
    width: 18px;
    height: 18px;
    accent-color: var(--neon-green);
    margin-top: 2px;
}

.checkbox-label a {
    color: var(--neon-green);
}

.auth-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary);
}

.auth-footer a {
    color: var(--neon-green);
    text-decoration: none;
    font-weight: 600;
}

.alert {
    padding: 12px 16px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
}

.alert-error {
    background: rgba(255, 51, 102, 0.1);
    border: 1px solid rgba(255, 51, 102, 0.3);
    color: var(--neon-red);
}

.w-full {
    width: 100%;
}
</style>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    
    if (formData.get('password') !== formData.get('password_confirm')) {
        AGTR.Toast.error('Şifreler eşleşmiyor');
        return;
    }
    
    const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password')
    };
    
    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            AGTR.Toast.success('Kayıt başarılı! Yönlendiriliyorsunuz...');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } else {
            AGTR.Toast.error(result.detail || 'Kayıt başarısız');
        }
    } catch (error) {
        AGTR.Toast.error('Bir hata oluştu');
    }
});
</script>
{% endblock %}
