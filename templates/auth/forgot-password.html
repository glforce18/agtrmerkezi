{% extends "base.html" %}

{% block title %}Şifremi Unuttum - AGTR Merkezi{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        <circle cx="12" cy="16" r="1"/>
                    </svg>
                </div>
                <h1 class="auth-title">Şifremi Unuttum</h1>
                <p class="auth-subtitle">E-posta adresinize şifre sıfırlama linki göndereceğiz</p>
            </div>
            
            <!-- Success Alert -->
            <div class="alert alert-success" id="successAlert" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span id="successMessage"></span>
            </div>
            
            <!-- Error Alert -->
            <div class="alert alert-error" id="errorAlert" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
                <span id="errorMessage"></span>
            </div>
            
            <!-- Forgot Password Form -->
            <form class="auth-form" id="forgotForm">
                <div class="form-group">
                    <label class="form-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        E-posta Adresi
                    </label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="ornek@email.com" required autocomplete="email">
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-full" id="submitBtn">
                    <span class="btn-text">Sıfırlama Linki Gönder</span>
                    <span class="btn-loader" style="display:none;">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" opacity="0.3"/>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </svg>
                    </span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Şifrenizi hatırladınız mı? <a href="/login">Giriş Yap</a></p>
            </div>
        </div>
    </div>
</section>

<style>
.auth-section {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}
.auth-container { max-width: 420px; width: 100%; }
.auth-card { padding: 40px; }
.auth-header { text-align: center; margin-bottom: 32px; }
.auth-logo { margin-bottom: 20px; }
.auth-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.auth-subtitle { color: var(--text-secondary); font-size: 15px; }
.auth-form { display: flex; flex-direction: column; gap: 20px; }
.form-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text-secondary);
}
.form-control {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 15px;
    transition: all 0.2s;
}
.form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1);
}
.auth-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border-color);
    color: var(--text-secondary);
}
.auth-footer a { color: var(--primary); font-weight: 500; }
.btn-lg {
    padding: 14px 24px;
    font-size: 16px;
}
.w-full { width: 100%; }
.alert {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    font-size: 14px;
}
.alert-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--danger-color, #ef4444);
}
.alert-success {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: var(--success-color, #10b981);
}
.spinner { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn-loader { display: inline-flex; align-items: center; }
</style>

<script>
function showError(message) {
    document.getElementById('successAlert').style.display = 'none';
    const alert = document.getElementById('errorAlert');
    document.getElementById('errorMessage').textContent = message;
    alert.style.display = 'flex';
}

function showSuccess(message) {
    document.getElementById('errorAlert').style.display = 'none';
    const alert = document.getElementById('successAlert');
    document.getElementById('successMessage').textContent = message;
    alert.style.display = 'flex';
}

function setLoading(loading) {
    const btn = document.getElementById('submitBtn');
    const text = btn.querySelector('.btn-text');
    const loader = btn.querySelector('.btn-loader');
    
    btn.disabled = loading;
    text.style.display = loading ? 'none' : 'inline';
    loader.style.display = loading ? 'inline-flex' : 'none';
}

document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    setLoading(true);
    
    const email = document.getElementById('email').value.trim();
    
    try {
        const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            showSuccess(result.message || 'Şifre sıfırlama linki e-posta adresinize gönderildi.');
            document.getElementById('forgotForm').reset();
        } else {
            showError(result.detail || result.message || 'Bir hata oluştu');
        }
    } catch (error) {
        showError('Bağlantı hatası. Lütfen tekrar deneyin.');
        console.error('Forgot password error:', error);
    } finally {
        setLoading(false);
    }
});
</script>
{% endblock %}
