<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı - AGTR Merkezi</title>
    <script>
        (function() {
            var theme = localStorage.getItem('agtr-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root {
            --bg-primary: #1a1d21;
            --bg-secondary: #23272b;
            --text-primary: #e4e6e8;
            --text-secondary: #9ca3af;
            --primary-color: #ff6b00;
            --primary-hover: #ff8c00;
            --danger-color: #ef4444;
        }
        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --primary-color: #e55a00;
            --primary-hover: #cc5000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 24px;
            opacity: 0.8;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--primary-color);
        }
        p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
        }
        .status {
            margin-top: 32px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 14px;
        }
        [data-theme="light"] .status {
            background: rgba(0, 0, 0, 0.05);
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--danger-color);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" aria-hidden="true">📡</div>
        <h1>Çevrimdışısınız</h1>
        <p>
            İnternet bağlantınız kesilmiş görünüyor.
            Lütfen bağlantınızı kontrol edin ve tekrar deneyin.
        </p>
        <button type="button" class="btn" onclick="location.reload()">
            Tekrar Dene
        </button>
        <div class="status" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            Bağlantı bekleniyor...
        </div>
    </div>
    <script>
        // Online olunca otomatik yenile
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
