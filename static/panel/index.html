<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGTR Merkezi - Server Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            background: rgba(26, 31, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 53, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff6b35 0%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo p {
            color: #9ca3af;
            font-size: 0.95rem;
        }

        .server-info {
            background: rgba(15, 20, 33, 0.8);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: none;
        }

        .server-info.active {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 107, 53, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .server-details h3 {
            color: #e8eaed;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .server-details p {
            color: #6b7280;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #e8eaed;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 20, 33, 0.8);
            border: 1px solid rgba(47, 54, 64, 0.8);
            border-radius: 10px;
            color: #e8eaed;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 8px;
            color: #9ca3af;
            transition: color 0.2s;
            user-select: none;
        }

        .toggle-password:hover {
            color: #ff6b35;
        }

        .helper-text {
            color: #6b7280;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .error.active {
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b35 0%, #e85d2c 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 16px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            position: relative;
            text-align: center;
            margin: 24px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(47, 54, 64, 0.8);
        }

        .divider span {
            background: rgba(26, 31, 42, 0.9);
            padding: 0 12px;
            color: #6b7280;
            font-size: 0.85rem;
            position: relative;
        }

        .steam-login {
            width: 100%;
            padding: 14px;
            background: rgba(15, 20, 33, 0.8);
            border: 1px solid rgba(47, 54, 64, 0.8);
            border-radius: 10px;
            color: #e8eaed;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .steam-login:hover {
            border-color: #ff6b35;
            background: rgba(15, 20, 33, 1);
        }

        .info-text {
            text-align: center;
            color: #6b7280;
            font-size: 0.8rem;
            margin-top: 20px;
        }

        .loading-screen {
            text-align: center;
            padding: 40px 0;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 107, 53, 0.2);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🎮 AGTR Merkezi</h1>
            <p>Server Panel Girişi</p>
        </div>

        <div id="loadingScreen" class="loading-screen">
            <div class="loading-spinner"></div>
            <p class="helper-text">Sunucular yükleniyor...</p>
        </div>

        <form id="loginForm" style="display: none;">
            <div class="server-info" id="serverInfo">
                <div class="server-icon">🖥️</div>
                <div class="server-details">
                    <h3 id="serverName">-</h3>
                    <p id="serverAddress">-</p>
                </div>
            </div>

            <div class="form-group">
                <label for="server">Sunucu Seçin</label>
                <select id="server" required>
                    <option value="">Bir sunucu seçin...</option>
                </select>
                <p class="helper-text" id="serverCount">- sunucu mevcut</p>
            </div>

            <div class="form-group">
                <label for="password">Panel Şifresi</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Panel şifrenizi girin" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
                <p class="helper-text">Panel şifrenizi sunucu sahibinden alabilirsiniz</p>
            </div>

            <div class="error" id="error"></div>

            <button type="submit" id="submitBtn">
                Panele Giriş Yap
            </button>
        </form>

        <div class="divider"><span>veya</span></div>

        <a href="https://agtrmerkezi.com/login" class="steam-login">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            </svg>
            Steam ile Giriş Yap
        </a>

        <p class="info-text">Steam ile giriş yaparsanız tüm sunucularınızı yönetebilirsiniz</p>
    </div>

    <script>
        const API_URL = '/api';
        let servers = [];

        // Load servers on page load
        async function loadServers() {
            try {
                const response = await fetch(`${API_URL}/panel/servers`);
                const data = await response.json();
                servers = data.servers || [];

                const select = document.getElementById('server');
                servers.forEach(server => {
                    const option = document.createElement('option');
                    option.value = server.id;
                    option.textContent = server.display;
                    option.dataset.name = server.name;
                    option.dataset.game = server.game_type;
                    option.dataset.ip = server.ip_address;
                    option.dataset.port = server.port;
                    select.appendChild(option);
                });

                document.getElementById('serverCount').textContent = `${servers.length} sunucu mevcut`;
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';

                if (servers.length === 0) {
                    showError('Şu anda panel erişimi olan sunucu bulunmamaktadır');
                }
            } catch (error) {
                console.error('Failed to load servers:', error);
                showError('Sunucular yüklenemedi. Lütfen daha sonra tekrar deneyin.');
                document.getElementById('loadingScreen').style.display = 'none';
            }
        }

        // Server selection change
        document.getElementById('server').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            if (selected.value) {
                document.getElementById('serverInfo').classList.add('active');
                document.getElementById('serverName').textContent = selected.dataset.name;
                document.getElementById('serverAddress').textContent =
                    `${selected.dataset.game?.toUpperCase()} • ${selected.dataset.ip}:${selected.dataset.port}`;
                hideError();
            } else {
                document.getElementById('serverInfo').classList.remove('active');
            }
        });

        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const serverId = document.getElementById('server').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!serverId) {
                showError('Lütfen bir sunucu seçin');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Giriş Yapılıyor...';
            hideError();

            try {
                const response = await fetch(`${API_URL}/panel/auth`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        server_id: parseInt(serverId),
                        panel_password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success && data.token) {
                    // Save panel token
                    localStorage.setItem('panel_token', data.token);
                    localStorage.setItem('panel_server_id', data.server_id);
                    localStorage.setItem('panel_mode', 'true');

                    // Redirect to panel subdomain
                    window.location.href = `https://panel.agtrmerkezi.com/servers/${data.server_id}/panel`;
                } else {
                    showError(data.message || 'Giriş başarısız');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Bağlantı hatası. Lütfen tekrar deneyin.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Panele Giriş Yap';
            }
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }

        function hideError() {
            document.getElementById('error').classList.remove('active');
        }

        // Load servers on page load
        loadServers();
    </script>
</body>
</html>
