<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#logo-gradient)" opacity="0.1"/>

  <!-- Main emblem -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Shield shape -->
    <path d="M 0,-75
             L 50,-45
             L 50,30
             C 50,30 40,60 0,75
             C -40,60 -50,30 -50,30
             L -50,-45
             Z"
          fill="url(#logo-gradient)"
          stroke="#ff6b00"
          stroke-width="2"/>

    <!-- AG letters -->
    <text x="0" y="10"
          font-family="Arial, sans-serif"
          font-size="60"
          font-weight="bold"
          fill="#fff"
          text-anchor="middle"
          dominant-baseline="middle">AG</text>

    <!-- TR letters smaller -->
    <text x="0" y="40"
          font-family="Arial, sans-serif"
          font-size="24"
          font-weight="bold"
          fill="#fff"
          text-anchor="middle"
          dominant-baseline="middle"
          opacity="0.9">TR</text>

    <!-- Crosshair accent -->
    <line x1="-35" y1="0" x2="-50" y2="0" stroke="#fff" stroke-width="3" opacity="0.8"/>
    <line x1="35" y1="0" x2="50" y2="0" stroke="#fff" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="-60" x2="0" y2="-70" stroke="#fff" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Gaming accent dots -->
  <circle cx="30" cy="30" r="4" fill="#ff6b00" opacity="0.6"/>
  <circle cx="170" cy="30" r="4" fill="#ff8800" opacity="0.6"/>
  <circle cx="30" cy="170" r="4" fill="#ffaa00" opacity="0.6"/>
  <circle cx="170" cy="170" r="4" fill="#ff6b00" opacity="0.6"/>
</svg>
