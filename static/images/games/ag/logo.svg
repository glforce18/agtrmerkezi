<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="ag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ag-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3d00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd2c00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#0d1b2a"/>
  
  <!-- AG Text -->
  <text x="50" y="125" font-family="'Impact', 'Arial Black', sans-serif" font-size="90" font-weight="900" fill="url(#ag-grad)" stroke="#005f73" stroke-width="3">AG</text>
  
  <!-- Adrenaline -->
  <text x="240" y="80" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="url(#ag-red)" letter-spacing="1">ADRENALINE</text>
  
  <!-- Gamer -->
  <text x="240" y="115" font-family="'Impact', sans-serif" font-size="28" font-weight="900" fill="url(#ag-grad)" letter-spacing="1">GAMER</text>
  
  <!-- Half-Life Mod -->
  <text x="240" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#64748b" letter-spacing="2">HALF-LIFE MOD</text>
  
  <!-- Speed lines effect -->
  <line x1="240" y1="85" x2="370" y2="85" stroke="#ff3d00" stroke-width="2" opacity="0.6"/>
  <line x1="245" y1="91" x2="365" y2="91" stroke="#ff3d00" stroke-width="1.5" opacity="0.4"/>
  
  <line x1="240" y1="120" x2="370" y2="120" stroke="#00d9ff" stroke-width="2" opacity="0.6"/>
  <line x1="245" y1="126" x2="365" y2="126" stroke="#00d9ff" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Target icon -->
  <circle cx="35" cy="40" r="18" fill="none" stroke="#00d9ff" stroke-width="3"/>
  <circle cx="35" cy="40" r="12" fill="none" stroke="#ff3d00" stroke-width="2"/>
  <circle cx="35" cy="40" r="3" fill="#ff3d00"/>
</svg>
