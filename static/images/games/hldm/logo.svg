<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="hl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#1a1a1a"/>
  
  <!-- Lambda Symbol -->
  <text x="50" y="130" font-family="'Times New Roman', serif" font-size="110" font-weight="bold" fill="url(#hl-grad)" filter="url(#glow)">λ</text>
  
  <!-- HALF-LIFE Text -->
  <text x="180" y="90" font-family="'Impact', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ff6b00" letter-spacing="1">HALF</text>
  <text x="180" y="135" font-family="'Impact', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ff8c00" letter-spacing="1">LIFE</text>
  
  <!-- Deathmatch -->
  <text x="180" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#94a3b8" letter-spacing="3">DEATHMATCH</text>
  
  <!-- Accent line -->
  <rect x="180" y="100" width="150" height="3" fill="#ff6b00" opacity="0.5"/>
</svg>
