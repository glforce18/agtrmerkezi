<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="cs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#0a1929"/>
  
  <!-- CS Text -->
  <text x="50" y="120" font-family="'Impact', 'Arial Black', sans-serif" font-size="80" font-weight="900" fill="url(#cs-grad)" stroke="#1e3a5f" stroke-width="2">CS</text>
  
  <!-- 1.6 Text -->
  <text x="220" y="120" font-family="'Impact', 'Arial Black', sans-serif" font-size="60" font-weight="900" fill="#ff9800" stroke="#bf360c" stroke-width="2">1.6</text>
  
  <!-- Counter-Strike Text -->
  <text x="50" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" letter-spacing="2">COUNTER-STRIKE</text>
  
  <!-- Crosshair accent -->
  <circle cx="35" cy="50" r="15" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <line x1="35" y1="35" x2="35" y2="45" stroke="#3b82f6" stroke-width="3"/>
  <line x1="35" y1="55" x2="35" y2="65" stroke="#3b82f6" stroke-width="3"/>
  <line x1="20" y1="50" x2="30" y2="50" stroke="#3b82f6" stroke-width="3"/>
  <line x1="40" y1="50" x2="50" y2="50" stroke="#3b82f6" stroke-width="3"/>
</svg>
